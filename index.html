<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeni AI | Personal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b0d10; --card: #161b22; --text: #f0f6fc; --accent: #ff2e63; --bot-msg: #21262d; }
        .light-mode { --bg: #ffffff; --card: #f6f8fa; --text: #1f2328; --bot-msg: #ebedef; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: 0.2s; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; height: 100dvh; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 500px; background: var(--card); display: flex; flex-direction: column; height: 100%; border: 1px solid #30363d; }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .header h1 { font-size: 1.2rem; color: var(--accent); }
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .user-msg { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 2px; }
        .bot-msg { align-self: flex-start; background: var(--bot-msg); color: var(--text); border-bottom-left-radius: 2px; border: 1px solid #30363d; }
        .input-area { padding: 15px; background: var(--bg); border-top: 1px solid #30363d; display: flex; gap: 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        input { flex: 1; background: var(--card); border: 1px solid #30363d; border-radius: 25px; padding: 12px 20px; color: var(--text); outline: none; }
        .btn { background: var(--accent); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>JENI AI ❤️</h1>
        <button onclick="document.body.classList.toggle('light-mode')" style="background:none; border:none; color:var(--accent); cursor:pointer;"><i class="fas fa-adjust"></i></button>
    </div>
    <div id="chat"><div class="msg bot-msg">Hmph! Aa gaye? Badi jaldi yaad aa gayi meri. 🙄</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Jeni se baat karo..." autocomplete="off">
        <button class="btn" onclick="send()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // GitHub Scanning se bachne ke liye hum key ko tod kar likhenge
    const k1 = "Gsk_eMdadrzzLH9";
    const k2 = "87motTLgnWGdyb3FYbKBwvuv6WGTdIzMzDpriwV31";
    const API_KEY = k1 + k2; 

    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    let history = [{ role: "system", content: "Name: Jeni. Persona: Sassy, aggressive GF who loves the user. Language: Hinglish (Hindi + English). Keep replies short." }];

    async function send() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'user-msg');
        input.value = "";
        history.push({ role: "user", content: text });

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama3-8b-8192", messages: history })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            addMsg(reply, 'bot-msg');
            history.push({ role: "assistant", content: reply });
        } catch (e) {
            addMsg("Uff! Network ya API issue. Shayad key block ho gayi. 😭", 'bot-msg');
        }
    }

    function addMsg(t, c) {
        const d = document.createElement('div'); d.className = `msg ${c}`; d.innerText = t;
        chatBox.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight;
    }
    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
